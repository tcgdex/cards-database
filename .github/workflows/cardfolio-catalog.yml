name: Publish Cardfolio catalog artifact

on:
  schedule:
    - cron: "12 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardfolio-catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current upstream default branch
        run: |
          git remote add upstream https://github.com/tcgdex/cards-database.git
          git fetch upstream master
          git fetch origin master
          git reset --hard origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/master
          git push origin HEAD:master

      - name: Check whether a catalog build is needed
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-catalog
          gh release download latest --repo "${{ github.repository }}" --pattern manifest.json --dir previous-catalog 2>/dev/null || true
          upstream_sha="$(git rev-parse upstream/master)"
          previous_sha="$(node -e "try { console.log(require('./previous-catalog/manifest.json').sourceSha || '') } catch { console.log('') }")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$upstream_sha" != "$previous_sha" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.catalog.outputs.changed == 'true'
        with:
          bun-version: "1.2.22"

      - name: Compile TCGdex
        if: steps.catalog.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile
          cd server
          bun install --frozen-lockfile
          bun run compile

      - name: Build validated artifacts
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TCGDEX_SOURCE_SHA: ${{ steps.catalog.outputs.source_sha }}
        run: |
          if [ -f previous-catalog/manifest.json ]; then
            node .cardfolio/build-tcgdex-artifacts.mjs server/generated catalog-artifacts previous-catalog/manifest.json
          else
            node .cardfolio/build-tcgdex-artifacts.mjs server/generated catalog-artifacts
          fi

      - name: Publish immutable release
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="$(git rev-parse --short=12 upstream/master)"
          artifact_sha="$(sha256sum catalog-artifacts/*.gz | sha256sum | cut -c1-12)"
          tag="catalog-${short_sha}-${artifact_sha}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "Cardfolio catalog ${short_sha} (${artifact_sha})" --notes "Validated TCGdex catalog from $(git rev-parse upstream/master)"
            gh release upload "$tag" --repo "${{ github.repository }}" catalog-artifacts/*.gz catalog-artifacts/manifest.json
          fi

      - name: Move latest catalog tag
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --repo "${{ github.repository }}" catalog-artifacts/*.gz catalog-artifacts/manifest.json --title "Latest validated Cardfolio catalog" --notes "Automatically promoted after validation."
