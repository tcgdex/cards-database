# OPEN-API API definition
openapi: 3.1.0
info:
  title: TCGdex API
  description: |
    A Multilanguage Pokémon TCG Database with Cards Pictures and most of the
    information contained on the cards.

    This is the v3 version of the API. Compared to v2:
    - Base path moved from `/v2/` to `/v3/`
    - Language codes now use ISO locale format (e.g. `fr-fr` instead of `fr`)
    - The special `intl` language returns all available translations in a single
      request: localized fields (name, description, effect, item/attack/ability
      text, stage, rarity, ...) are returned as `{locale: value}` maps that only
      include locales with data (see the `LocalizedString` schema)
    - Pricing moved from the card root to the `variants` array
    - `illustrator` is now an `illustrators` array
    - Attacks, abilities, rarities, stages and illustrators expose unified IDs
      using the `{entity-type}:{unique-id}` format
    - LEGEND cards use the `stage` field instead of a name suffix
    - Deprecated standalone sets (Jumbo, W Promotional, Radiant Collection) are
      served as variants of their parent set
    - Cards gained `setNumber`, `thirdPartyIds`, per-card `releaseDate` override
      and a `platforms` list (`physical-tcg`, `tcgp`, `tcgl`, `tcgo`)
    - Cards expose a `relations` object linking translations, reprints
      (`sameCards`) and alternate-`rarities` cards
    - Sets' `abbreviation` now carries the official set code used by The
      Pokemon Company (especially for Asian-language sets)
    - Variants are now described by a set of orthogonal facets instead of a
      single `type`. Each variant carries `foil` (normal/holo/reverse),
      `pattern`, `print`, `size`, `stamps`, `origin`, `line`, `artwork` and
      `background`, plus a stable semantic `variantId` (e.g. `holo-cosmos`,
      `normal-1st-edition`) built from those facets. `Card.variants` is now an
      array of these variant objects; the boolean variant maps and the legacy
      `variant_detailed`/`type`/`subtype`/`foil`
      fields are gone
    - `origin` distinguishes the distribution source of promos (pre-release,
      japan-post, worlds-2024, ...) from the printed `stamps` on the card
    - `line` describes how a variant is obtained
      (main/parallel/restricted/exclusive)
    - Cards expose their owning `serie`, and `set` is now optional so that
      serie-wide cards (e.g. miscellaneous promos) remain listable
    - Products gained a `cardtraderId` identifier used as pricing metadata
    - Set `cardCount` drops the legacy `firstEd` count; per-variant breakdowns
      are available through `Card.variants` and the `/variants` endpoint
    - Variants gained an `etched` facet describing the etched/textured foil
      layer (e.g. Tera Pokémon ex, Illustration Rares)
    - Sets gained a `copyright` line (`{text, year}`); cards may override it
      with their own `copyright`
    - New endpoints: card detection (`/detect`), sealed `products` and their
      pull-rates/pricing, set `pull-rates`/`pack-structure`/`box-odds`, and
      `pricing/history` + `pricing/trends` (see the dedicated section below)
    - Variants expose their TCGplayer SKUs (language / printing / condition)
      with live prices through `/cards/{id}/variants/{variant}/skus`
    - Random endpoints restored: `/random/card`, `/random/serie` and
      `/random/set`
    - Cards expose the `effect` field for trainer and energy card effects
    - Card, set, serie and product list endpoints now return a paginated
      envelope `{pagination, data}` instead of a plain array

    ### Text markup

    Energy symbols cannot be represented in plain text. Wherever they occur
    (card names, attack/ability effects, trainer and energy effects), they use
    the following markup: `{G}` Grass, `{R}` Fire, `{W}` Water, `{L}` Lightning,
    `{P}` Psychic, `{F}` Fighting, `{D}` Darkness, `{M}` Metal, `{Y}` Fairy,
    `{N}` Dragon, `{C}` Colorless. The codes follow the shorthand used by
    Wizards of the Coast oracle text and the Pokémon TCG Card Dex.

    Error responses follow RFC 9457 standard for problem details in HTTP APIs,
    with Content-Type application/problem+json. All errors include standardized
    attributes like type, title, status, detail, endpoint, and method.

    The card, set, serie and product list endpoints support filtering, sorting, and pagination features.
    See https://tcgdex.dev/rest/filtering-sorting-pagination for more details.

    ### Authentication & rate limiting

    Three access tiers are available:
    - Anonymous (no API key): 600 requests/minute, GET endpoints only
    - Free: 2400 requests/minute (with a free API key)
    - Paying: 6000 requests/minute
    Authenticated requests send the API key in the `X-API-Key` header. Card
    detection (`/detect`) requires an API key. Every response includes the
    standard     rate-limit headers (`RateLimit-Policy` and `RateLimit`, per
    draft-ietf-httpapi-ratelimit-headers), shown on the `/cards` endpoint and
    applied to all endpoints. See https://tcgdex.dev/docs/rate-limiting for the
    current limits.

    ### Card detection, products, pull rates & pricing history

    This version also adds:
    - `POST /{lang}/detect` — self-hosted card detection (image upload or URL)
    - `/products` and `/products/{id}` — sealed products (booster boxes, ETBs, ...)
    - `/sets/{id}/pull-rates`, `/sets/{id}/pack-structure`, `/sets/{id}/box-odds`
    - `/cards/{id}/pricing/history` and `/cards/{id}/pricing/trends` — 6 months of price history
    - `/cards/{id}/variants/{variant}/skus` — live TCGplayer SKU prices per variant
      (language / printing / condition)

    You can find out more about TCGdex at
    [https://www.tcgdex.net](https://www.tcgdex.net) or on
    [Discord](https://discord.gg/NehYTAhsZE).
  contact:
    name: TCGdex
    url: https://github.com/tcgdex/cards-database
    email: contact@tcgdex.net
  license:
