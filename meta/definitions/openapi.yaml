  version: "3.0.0-beta"
externalDocs:
  description: Find out more about TCGdex
  url: https://www.tcgdex.net/docs
servers:
  - url: https://api.tcgdex.net/v3/{lang}
    variables:
      lang:
        description: |
          The language (ISO locale) of the response, or `intl` to fetch data from
          all available languages in a single request. When `intl` is used,
          localized fields (name, description, effect, item/attack/ability text,
          stage, rarity, ...) are returned as a map keyed by locale, e.g.
          `{"name": {"en-us": "Furret", "fr-fr": "Fouinar"}}`, and only include
          locales that have data available (see the `LocalizedString` schema).
        enum:
          - en-us
          - fr-fr
          - es-es
          - es-mx
          - it-it
          - pt-br
          - pt-pt
          - de-de
          - nl-nl
          - pl-pl
          - ru-ru
          - ja-jp
          - ko-kr
          - zh-cn
          - zh-tw
          - id-id
          - th-th
          - intl
        default: en-us
tags:
  - name: cards
    description: Fetch cards globally
  - name: sets
    description: Fetch sets
  - name: series
    description: Fetch series
  - name: random
    description: Fetch a random card, set or series
  - name: filters
    description: Different requests to filter cards
  - name: products
    description: Fetch sealed products (booster boxes, ETBs, pre-releases, etc.)
  - name: pricing
    description: Pricing data (historical and trends)
  - name: detect
    description: Identify cards from an image
security: []
paths:
  /cards:
    get:
      tags:
        - cards
      summary: fetch the list of cards
      description: Returns a list of all cards, with support for filtering, sorting, and pagination
      parameters:
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sortField'
        - $ref: '#/components/parameters/sortOrder'
        - $ref: '#/components/parameters/paginationPage'
        - $ref: '#/components/parameters/paginationItemsPerPage'
      responses:
        '200':
          description: 'Successful request'
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /cards/{cardId}:
    get:
      tags:
        - cards
      summary: Find card by ID
      description: Returns detailed information about a specified card
      parameters:
        - name: cardId
          in: path
          description: ID of card to return
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sets:
    get:
      tags:
        - sets
      summary: Get all sets
      description: Lists all Pokemon TCG sets with basic information, with support for filtering, sorting, and pagination
      parameters:
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sortField'
        - $ref: '#/components/parameters/sortOrder'
        - $ref: '#/components/parameters/paginationPage'
        - $ref: '#/components/parameters/paginationItemsPerPage'
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sets/{set}:
    get:
      tags:
        - sets
      summary: Find set by ID
      description: Returns detailed information about a specific set, including its card list
      parameters:
        - name: set
          in: path
          description: ID of set to return
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Set'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sets/{set}/{cardLocalId}:
    get:
      tags:
        - sets
        - cards
      summary: Find card by set and local ID
      description: Returns detailed information about a specific card identified by its set and local ID within that set
      parameters:
        - name: set
          in: path
          description: ID of the set
          required: true
          schema:
            type: string
        - name: cardLocalId
          in: path
          description: Local card ID within the set
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /series:
    get:
      tags:
        - series
      summary: Get all series
      description: Returns a list of all available Pokemon TCG series, with support for filtering, sorting, and pagination
      parameters:
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sortField'
        - $ref: '#/components/parameters/sortOrder'
        - $ref: '#/components/parameters/paginationPage'
        - $ref: '#/components/parameters/paginationItemsPerPage'
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerieList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /series/{serie}:
    get:
      tags:
        - series
      summary: Find series by ID
      description: Returns detailed information about a specific series, including all sets in that series
      parameters:
        - name: serie
          in: path
          description: ID of serie to return
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Serie'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /random/card:
    get:
      tags:
        - random
      summary: Returns a random card
      description: Returns a random card from the entire database
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /random/serie:
    get:
      tags:
        - random
      summary: Returns a random series
      description: Returns a random series from the entire database
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Serie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /random/set:
    get:
      tags:
        - random
      summary: Returns a random set
      description: Returns a random set from the entire database
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Set'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /categories:
    get:
      tags:
        - filters
      summary: Get all categories
      description: Returns a list of all available card categories
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /categories/{category}:
    get:
      tags:
        - filters
      summary: Get cards by category
      description: Returns cards matching the specified category
      parameters:
        - name: category
          in: path
          description: Card category to filter by (display name, e.g. `Pokemon`)
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hp:
    get:
      tags:
        - filters
      summary: Get all HP values
      description: Returns a list of all available HP values for Pokemon cards
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /hp/{hp}:
    get:
      tags:
        - filters
      summary: Get cards by HP value
      description: Returns cards with the specified HP value
      parameters:
        - name: hp
          in: path
          description: HP value to filter by
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /illustrators:
    get:
      tags:
        - filters
      summary: Get all illustrators
      description: Returns a list of all card illustrators
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /illustrators/{illustrator}:
    get:
      tags:
        - filters
      summary: Get cards by illustrator
      description: Returns cards by the specified illustrator
      parameters:
        - name: illustrator
          in: path
          description: Illustrator to filter by. Accepts either the display name (e.g. `Ken Sugimori`) or the unified identifier (e.g. `illustrator:ken-sugimori`).
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /rarities:
    get:
      tags:
        - filters
      summary: Get all rarities
      description: Returns a list of all card rarity types
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /rarities/{rarity}:
    get:
      tags:
        - filters
      summary: Get cards by rarity
      description: Returns cards with the specified rarity
      parameters:
        - name: rarity
          in: path
          description: Rarity to filter by. Accepts either the display name (e.g. `Rare`) or the unified identifier (e.g. `rarity:rare`).
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /retreats:
    get:
      tags:
        - filters
      summary: Get all retreat costs
      description: Returns a list of all available retreat cost values
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /retreats/{retreat}:
    get:
      tags:
        - filters
      summary: Get cards by retreat cost
      description: Returns cards with the specified retreat cost
      parameters:
        - name: retreat
          in: path
          description: Retreat cost to filter by
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEndpoint'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /types:
    get:
      tags:
        - filters
      summary: Get all types
      description: Returns a list of all Pokemon card types
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /types/{type}:
    get:
      tags:
        - filters
      summary: Get cards by type
      description: Returns cards of the specified type
      parameters:
        - name: type
          in: path
          description: Card type to filter by (display name, e.g. `Psychic`)
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          description: Successful request
          content:
