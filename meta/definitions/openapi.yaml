openapi: 3.1.0
info:
  title: Pokémon TCG Pocket API
  version: 2.0.0
servers:
  - url: /v2/{lang}
    variables:
      lang:
        default: en
        enum: [en, de, es, fr, it, pt-br, zh-tw, ja, ko]
paths:
  /cards:
    get:
      summary: List cards
      responses:
        "200":
          description: Card summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardResume"
  /cards/search:
    get:
      summary: Search cards
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /cards/search/options:
    get:
      summary: List card search options
      responses:
        "200":
          description: Search options
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /cards/{id}:
    get:
      summary: Get a card by exact ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"
  /cards/{id}/relations:
    get:
      summary: Get card relations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Card relations
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /packs:
    get:
      summary: List cross-expansion event packs
      responses:
        "200":
          description: Event pack summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventPackResume"
  /packs/{id}:
    get:
      summary: Get an event pack by slug or game ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pack with original card printings and position pools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EventPackResume"
                  - type: object
                    required: [slots, cards]
                    properties:
                      slots:
                        type: array
                        items:
                          type: object
                          required: [positions, cardIds]
                          properties:
                            positions:
                              type: array
                              items:
                                type: integer
                            cardIds:
                              type: array
                              items:
                                type: string
                      cards:
                        type: array
                        items:
                          $ref: "#/components/schemas/CardResume"
        "404":
          $ref: "#/components/responses/NotFound"
  /sets/{id}:
    get:
      summary: Get a set by exact ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /series/tcgp:
    get:
      summary: Get the Pokémon TCG Pocket series
      responses:
        "200":
          description: Pokémon TCG Pocket series
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            type: object
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            type: object
  schemas:
    EventPackResume:
      type: object
      required: [id, gameId, releaseDate, name, image, cardCount, cardsPerPack]
      properties:
        id:
          type: string
        gameId:
          type: string
        releaseDate:
          type: string
          format: date
        name:
          type: string
        image:
          type: string
          format: uri
        cardCount:
          type: integer
        cardsPerPack:
          type: integer
    CardResume:
      type: object
      required: [id, localId, name]
      properties:
        id:
          type: string
        localId:
          type: string
        name:
          type: string
        image:
          type: string
    Card:
      type: object
      required: [id, localId, name, category, rarity, set]
      additionalProperties: true
      properties:
        id:
          type: string
        localId:
          type: string
        name:
          type: string
        category:
          type: string
        rarity:
          type: string
        image:
          type: string
        set:
          type: object
